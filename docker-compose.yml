services:
  api:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      DB_PATH: /data/school.db
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - school-data:/data
    restart: unless-stopped

  correction:
    build: ./correction
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      FLASK_DEBUG: ${FLASK_DEBUG:-0}
    ports:
      - "${CORRECTION_PORT:-5001}:5000"
    restart: unless-stopped

volumes:
  school-data:
